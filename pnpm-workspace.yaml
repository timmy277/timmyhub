# frontend/ đã gia nhập workspace gốc để dùng chung @timmyhub/contracts qua workspace:*
# (trước đó tách riêng bằng frontend/pnpm-workspace.yaml — nay đã gỡ, xem docs/05-infra/monorepo-and-build.md).
packages:
  - 'backend/apps/*'
  - 'backend/libs/*'
  - 'shared/*'
  - 'frontend'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@timmyhub/prisma': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - prettier@3.9.7
