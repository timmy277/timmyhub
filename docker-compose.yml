services:
  # 1. Redis Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: timmyhub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: backend/apps/api/Dockerfile
    container_name: timmyhub-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    env_file:
      - backend/apps/api/.env
    depends_on:
      redis:
        condition: service_healthy

  # 3. Elasticsearch Full-text Search Engine
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: timmyhub-elasticsearch
    restart: unless-stopped
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 4. Background Worker (BullMQ & Outbox Dispatcher)
  worker:
    build:
      context: .
      dockerfile: backend/apps/worker/Dockerfile
    container_name: timmyhub-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    env_file:
      - backend/apps/api/.env
    depends_on:
      redis:
        condition: service_healthy

  # 5. Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: timmyhub-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      - api

volumes:
  redis_data:
    driver: local
  es_data:
    driver: local
